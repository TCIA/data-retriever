name: Microsoft Store

on:
  pull_request:
    paths:
      - '.github/workflows/microsoft-store.yml'
      - 'scripts/windows/**'
      - 'build/windows/store/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Store version (major.minor.patch.0; higher than the live package)'
        required: true
        type: string
      publish:
        description: 'Submit the package to Microsoft Store certification'
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

# Partner Center permits only one pending submission per app.
concurrency:
  group: microsoft-store
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.config.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package configuration
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          AUTO_PUBLISH: ${{ vars.MSSTORE_PUBLISH_ENABLED }}
          PACKAGE_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PACKAGE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'release') { $env:RELEASE_TAG -replace '^v', '' } elseif ($env:EVENT_NAME -eq 'pull_request') { '0.0.1.0' } else { $env:INPUT_VERSION }
          if ($version -match '^\d+\.\d+\.\d+$') { $version += '.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+\.0$' -or @($version.Split('.') | Where-Object { [long]$_ -gt 65535 }).Count -gt 0) {
            throw 'Use a numeric major.minor.patch.0 Store version (components 0-65535); release tags must be vMAJOR.MINOR.PATCH.'
          }
          $publishing = $env:PUBLISH -eq 'true' -or ($env:EVENT_NAME -eq 'release' -and $env:AUTO_PUBLISH -eq 'true')
          foreach ($name in @('PACKAGE_NAME', 'PACKAGE_PUBLISHER', 'PUBLISHER_DISPLAY_NAME')) {
            if ($publishing -and [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing Store identity configuration: $name" }
          }
          if (!$env:PACKAGE_NAME) { $env:PACKAGE_NAME = 'TCIA.DataRetriever.Test' }
          if (!$env:PACKAGE_PUBLISHER) { $env:PACKAGE_PUBLISHER = 'CN=TCIA Development' }
          if (!$env:PUBLISHER_DISPLAY_NAME) { $env:PUBLISHER_DISPLAY_NAME = 'TCIA' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "STORE_VERSION=$version" >> $env:GITHUB_ENV
          "STORE_IDENTITY_NAME=$env:PACKAGE_NAME" >> $env:GITHUB_ENV
          "STORE_PUBLISHER=$env:PACKAGE_PUBLISHER" >> $env:GITHUB_ENV
          "STORE_PUBLISHER_DISPLAY_NAME=$env:PUBLISHER_DISPLAY_NAME" >> $env:GITHUB_ENV
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install matching Wails CLI
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve Wails version' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Wails installation failed' }
      - name: Build Windows app for the Store
        run: |
          wails build -platform windows/amd64 -clean -webview2 error -ldflags "-X main.distChannel=msstore -X main.version=$env:STORE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Wails build failed' }
      - name: Package and validate MSIX
        run: |
          ./scripts/windows/package-store.ps1 -Version $env:STORE_VERSION -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-${{ steps.config.outputs.version }}
          path: build/bin/store/*.msix
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && !github.event.release.prerelease && vars.MSSTORE_PUBLISH_ENABLED == 'true')
    runs-on: windows-2022
    timeout-minutes: 30
    environment: microsoft-store
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: microsoft-store-${{ needs.package.outputs.version }}
          path: store-package
      - name: Install Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit package to certification
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          foreach ($name in @('TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET', 'PRODUCT_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing Store configuration: $name" }
          }
          $packages = @(Get-ChildItem store-package -Filter *.msix)
          if ($packages.Count -ne 1) { throw 'Expected exactly one MSIX from the package job' }
          msstore reconfigure --tenantId "$env:TENANT_ID" --sellerId "$env:SELLER_ID" --clientId "$env:CLIENT_ID" --clientSecret "$env:CLIENT_SECRET"
          if ($LASTEXITCODE -ne 0) { throw 'Store authentication failed' }
          msstore publish $packages[0].FullName --appId "$env:PRODUCT_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Store submission failed' }
