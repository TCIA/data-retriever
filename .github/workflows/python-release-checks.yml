name: Python release validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install packaging
      - run: python -m unittest discover -s python/tests -p test_release.py -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate release workflow syntax and reusable inputs
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck='' .github/workflows/python-release.yml .github/workflows/python-release-checks.yml .github/workflows/python-wheels.yml
