name: Publish Python release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Merged immutable tag, e.g. python-v1.0.0rc1'
        required: true
        type: string
      target:
        description: 'Package index (production requires the pypi environment approval)'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: python-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Require manual dispatch from main in the TCIA repository
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REPOSITORY" = 'TCIA/data-retriever'
          test "$RELEASE_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install packaging
      - name: Resolve and validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/python_release.py resolve-tag

  build:
    needs: prepare
    uses: ./.github/workflows/python-wheels.yml
    with:
      release_version: ${{ needs.prepare.outputs.version }}
      source_ref: ${{ needs.prepare.outputs.commit }}
      artifact_prefix: release-wheel

  validate:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install packaging twine
      - uses: actions/download-artifact@v4
        with:
          pattern: release-wheel-*
          path: release-dist
          merge-multiple: true
      - name: Require the exact four wheels, release version and source revision
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python scripts/python_release.py check-wheels release-dist
          python scripts/check_python_wheel.py release-dist
          python -m twine check --strict release-dist/*.whl
          cat release-dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-release-wheels
          path: release-dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-dist/SHA256SUMS
          if-no-files-found: error

  testpypi:
    if: inputs.target == 'testpypi'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tcia-data-retriever
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-release-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi:
    if: inputs.target == 'pypi'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tcia-data-retriever
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-release-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
