name: Headless CLI and Python wheels

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            platform: manylinux_2_17_x86_64
            binary: tdr
          - runner: windows-latest
            goos: windows
            goarch: amd64
            platform: win_amd64
            binary: tdr.exe
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            platform: macosx_11_0_x86_64
            binary: tdr
          - runner: macos-14
            goos: darwin
            goarch: arm64
            platform: macosx_11_0_arm64
            binary: tdr
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      TDR_VERSION: 0.0.0.dev0
      TDR_GIT_COMMIT: ${{ github.sha }}
      TDR_WHEEL_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test headless CLI and download core
        run: go test ./core/app ./internal/cli ./cmd/tdr
      - name: Build headless executable
        shell: bash
        run: |
          mkdir -p wheel-build
          go build -trimpath -ldflags "-s -w -X main.version=$TDR_VERSION -X main.gitHash=$TDR_GIT_COMMIT" -o "wheel-build/${{ matrix.binary }}" ./cmd/tdr
      - name: Install build tools
        run: python -m pip install build
      - name: Test Python wrapper
        env:
          PYTHONPATH: python/src
        run: python -m unittest discover -s python/tests -p test_wrapper.py -v
      - name: Build wheel
        shell: bash
        run: |
          export TDR_BINARY="$PWD/wheel-build/${{ matrix.binary }}"
          python -m build --wheel --outdir wheelhouse python
          python scripts/check_python_wheel.py wheelhouse
      - name: Install and smoke-test wheel on Python 3.10
        shell: bash
        env:
          TDR_INSTALLED_SMOKE: '1'
        run: |
          python -m pip install --only-binary=:all: wheelhouse/*.whl
          tcia-data-retriever --version
          python -m unittest discover -s python/tests -p test_installed.py -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and smoke-test wheel on Python 3.13
        shell: bash
        env:
          TDR_INSTALLED_SMOKE: '1'
        run: |
          python -m pip install --only-binary=:all: wheelhouse/*.whl
          python -m unittest discover -s python/tests -p test_installed.py -v
      - name: Upload review artifacts (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.platform }}
          path: |
            wheelhouse/*.whl
            wheelhouse/SHA256SUMS
          if-no-files-found: error
